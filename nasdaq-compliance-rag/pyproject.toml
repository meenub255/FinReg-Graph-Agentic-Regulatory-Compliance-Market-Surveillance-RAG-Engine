[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nasdaq-compliance-rag"
version = "1.0.0"
description = "Enterprise Agentic Regulatory Compliance & Policy RAG System (LangGraph + Qdrant + FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "langgraph>=0.2.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
