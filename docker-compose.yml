version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nasdaq-compliance-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  compliance-rag-api:
    build: .
    container_name: nasdaq-compliance-rag-api
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=nasdaq_sec_regulatory_corpus
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
